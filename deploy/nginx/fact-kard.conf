# FACT-KARD — Nginx (ejemplo para sistema.asescon.net)
# Copiar a /etc/nginx/sites-available/fact-kard y enlazar en sites-enabled.
# Reemplazar sistema.asescon.net si el dominio cambia (es el ÚNICO lugar con el dominio,
# además del .env del backend).
#
#   /          → frontend React compilado (frontend/dist)
#   /api/      → Django/Gunicorn en 127.0.0.1:8001 (nunca expuesto a Internet)
#   /static/   → archivos de Django (collectstatic: admin)
#   /admin/    → admin de Django (opcional: restringir por IP, ver docs)

upstream fact_kard_api {
    server 127.0.0.1:8001;
    keepalive 16;
}

# HTTP: solo validación de Let's Encrypt y redirección a HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name sistema.asescon.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sistema.asescon.net;

    # Certbot completa/gestiona estas rutas (docs/DESPLIEGUE_VPS.md, paso SSL).
    ssl_certificate     /etc/letsencrypt/live/sistema.asescon.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sistema.asescon.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Uploads: capturas XML/PDF/imagen de hasta 10 MB (CAPTURA_MAX_BYTES) + margen.
    client_max_body_size 12m;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Todo el frontend se sirve desde este dominio (sin CDNs externos).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    # Activar HSTS solo cuando HTTPS funcione bien (y no se piense volver a HTTP):
    # add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- API Django (Gunicorn) ---
    location /api/ {
        proxy_pass http://fact_kard_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Nginx agrega la IP real al final; Django la toma con NUM_PROXIES=1.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Excel del Kardex / Formato 13.1 pueden tardar (Gunicorn timeout = 120 s).
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
        # Las respuestas de la API no se guardan en cachés intermedias.
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
    }

    location = /api/health/ {
        access_log off;
        proxy_pass http://fact_kard_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Admin de Django (opcional) ---
    location /admin/ {
        # Para restringir: allow <IP de la oficina>; deny all;
        proxy_pass http://fact_kard_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Archivos estáticos de Django (collectstatic) ---
    location /static/ {
        alias /srv/fact-kard/app/backend/staticfiles/;
        expires 30d;
        access_log off;
    }

    # --- Frontend React (npm run build) ---
    root /srv/fact-kard/app/frontend/dist;

    # Archivos con hash en el nombre: caché larga.
    # Un add_header dentro de location anula los del server: se repiten los de seguridad.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        access_log off;
        try_files $uri =404;
    }

    # Rutas del SPA (/dashboard, /kardex, ...) → index.html, que nunca se cachea.
    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }
}
