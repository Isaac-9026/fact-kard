<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="shape1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.04" />
    </linearGradient>
    <linearGradient id="shape2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#c7d2fe" stop-opacity="0.03" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-opacity="0.6" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bg)" />

  <!-- Subtle grid -->
  <rect width="800" height="800" fill="url(#grid)" />

  <!-- Abstract light geometrical shapes -->
  <circle cx="650" cy="180" r="220" fill="url(#shape1)" />
  <circle cx="200" cy="620" r="260" fill="url(#shape2)" />

  <!-- Minimalist isometric accounting cards illustration -->
  <g transform="translate(400, 390)">
    <!-- Bottom layer -->
    <path d="M 0,-90 L 170,-5 L 0,80 L -170,-5 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <path d="M -170,-5 L 0,80 L 0,94 L -170,9 Z" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5" />
    <path d="M 170,-5 L 0,80 L 0,94 L 170,9 Z" fill="#e2e8f0" stroke="#e2e8f0" stroke-width="1.5" />

    <!-- Middle layer -->
    <g transform="translate(0, -45)">
      <path d="M 0,-90 L 170,-5 L 0,80 L -170,-5 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
      <path d="M -170,-5 L 0,80 L 0,94 L -170,9 Z" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
      <path d="M 170,-5 L 0,80 L 0,94 L 170,9 Z" fill="#e2e8f0" stroke="#e2e8f0" stroke-width="1.5" />
      <!-- Subtle accent lines -->
      <line x1="-80" y1="-10" x2="30" y2="40" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
      <line x1="-50" y1="-30" x2="60" y2="20" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Top layer with subtle indigo brand accent -->
    <g transform="translate(0, -90)">
      <path d="M 0,-90 L 170,-5 L 0,80 L -170,-5 Z" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5" />
      <path d="M -170,-5 L 0,80 L 0,94 L -170,9 Z" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="1.5" />
      <path d="M 170,-5 L 0,80 L 0,94 L 170,9 Z" fill="#c7d2fe" stroke="#c7d2fe" stroke-width="1.5" />
      <!-- Top surface details -->
      <circle cx="-50" cy="-10" r="12" fill="#4f46e5" fill-opacity="0.12" />
      <line x1="-20" y1="-10" x2="70" y2="30" stroke="#4f46e5" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round" />
      <line x1="-20" y1="5" x2="40" y2="32" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    </g>
  </g>
</svg>
